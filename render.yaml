services:
  - type: web
    name: liveface365-api
    runtime: node
    plan: free
    region: ohio
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://hsw365.github.io/liveface365
      - key: FRONTEND_ORIGINS
        value: https://hsw365.github.io,https://hsw365.co
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CREATOR_PRICE_ID
        sync: false
      - key: STRIPE_STUDIO_PRICE_ID
        sync: false
      - key: FACE_ENGINE_URL
        sync: false
      - key: FACE_ENGINE_API_KEY
        sync: false
